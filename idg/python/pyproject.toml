[project]
name = "idg-python"
description = "Image-Domain Gridding (IDG) implementation in Python, with selectable numba and jax backends"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "h5py>=3.11",
    "numpy>=2.0",
    "numba>=0.60",
    "jax>=0.4",
]

[project.scripts]
idg = "idg_python.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idg_python"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]
