[project]
name = "idg-input"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numba>=0.61.2",
    "numpy>=2.3.5",
    "pydantic>=2.12.5",
]

[project.scripts]
idg-input = "idg_input.main:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
