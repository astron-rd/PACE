name: probe
on:
  push:
    branches: [probe/das6-hardware]
    paths: [.github/workflows/probe.yaml]
jobs:
  probe:
    runs-on: [slurm]
    steps:
      - uses: astron-rd/slurm-action@v1.4
        with:
          partition: rbq
          constraints: zen5
          time: 00:05:00
          commands: |
            set +e
            type module; module --version
            module avail 2>&1 | tail -30
            for t in cmake gcc cc make pkg-config h5cc spack conda pixi; do echo "R $t: $(command -v $t || echo none)"; done
            cat /etc/os-release | head -2
