name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            env | grep -E '^SLURM.*(CPU|TASK|GPU|MEM|TRES|GRES|NODE|THREAD|SOCKET|CORE)' | sort | sed 's/^/R env: /'
            scontrol show config | grep -E 'SelectType|TaskPlugin|GresTypes' | sed 's/^/R conf: /'
            scontrol show node $(hostname) | grep -E 'CPUTot|ThreadsPerCore|Sockets|RealMemory|Gres|CfgTRES|AllocTRES' | sed 's/^/R node: /'
            scontrol show job $SLURM_JOB_ID | grep -E 'NumCPUs|TRES|MinMemory|Gres' | sed 's/^/R job: /'
