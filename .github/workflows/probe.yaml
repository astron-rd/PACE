name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: W7700
            partition: rbq
            gres: gpu:W7700
          - name: R9700
            partition: rbq
            gres: gpu:R9700
    name: probe (${{ matrix.name }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: ${{ matrix.gres }}
          time: 00:05:00
          commands: |
            set +e
            section() { echo; echo "### $*"; }
            hostname
            scontrol show job -d "$SLURM_JOB_ID" 2>&1 | grep -iE "gres|tres|IDX"
            grep . /etc/slurm/gres.conf 2>&1 | grep -v "^#"
            for d in /sys/class/drm/card[0-9]*/device; do [ -e "$d/vendor" ] && echo "$(basename $(dirname $d)) $(basename $(readlink -f $d)) vendor=$(cat $d/vendor) device=$(cat $d/device)"; done
            nvidia-smi --query-gpu=index,name,pci.bus_id --format=csv,noheader 2>&1
            env | grep -E "^(CUDA_VISIBLE_DEVICES|ROCR_VISIBLE_DEVICES|GPU_DEVICE_ORDINAL|SLURM_.*GPU.*)=" | sort
