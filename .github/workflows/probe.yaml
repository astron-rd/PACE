name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: rbq, gpu: AD4000 }
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            source /etc/profile.d/lmod.sh 2>/dev/null
            module load rocm >/dev/null 2>&1
            env | grep -iE "OCL|OPENCL" | sed 's/^/ENV /'
            ls $(dirname $(dirname $(command -v clinfo)))/etc/OpenCL/vendors 2>&1 | sed 's/^/ROCMICD /'
            clinfo -l 2>&1 | sed 's/^/CLL /'
            clinfo 2>&1 | grep -iE "Device Name|Board Name|Device Vendor  " | sed 's/^/CL /'
            OCL_ICD_VENDORS=$(dirname $(dirname $(command -v clinfo)))/etc/OpenCL/vendors clinfo -l 2>&1 | sed 's/^/CLROCM /'
