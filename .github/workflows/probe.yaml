name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            set +e
            hostname
            udevadm info /sys/class/dmi/id | grep -E "MEMORY_DEVICE_[0-9]+_" | sed 's/^E: MEMORY_DEVICE_[0-9]*_//; s/=.*//' | sort | uniq -c
            udevadm info /sys/class/dmi/id | grep -E "MEMORY_DEVICE_[0-9]+_(SIZE|PRESENT|LOCATOR|SPEED_MTS|CONFIGURED_SPEED_MTS|TYPE|PART_NUMBER)=" | sed -n '40,200p'
            python3 - <<'PY2'
            import re, subprocess
            u = subprocess.run(["udevadm", "info", "/sys/class/dmi/id"], capture_output=True, text=True).stdout
            s = [int(v) for v in re.findall(r"^E: MEMORY_DEVICE_\d+_SIZE=(\d+)$", u, re.M)]
            print("n", len(s), "GiB", sum(s) / 2**30)
            PY2
            lstopo --of console --no-io 2>&1 | head -8
