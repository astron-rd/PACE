name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            gres: ""
          - name: A4000
            gres: gpu:A4000
    name: probe (${{ matrix.name }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: defq
          gres: ${{ matrix.gres }}
          time: 00:05:00
          commands: |
            set +e
            section() { echo; echo "### $*"; }
            section host; hostname
            section udev-memory; udevadm --version; udevadm info /sys/class/dmi/id 2>&1 | grep -E "MEMORY_(ARRAY|DEVICE_[0-9]+_(SPEED|CONFIGURED_SPEED|SIZE|TYPE|PRESENT|LOCATOR))" | head -40
            section udev-db; ls -l /run/udev/data 2>&1 | grep -i dmi
            section edac-dimm; ls /sys/devices/system/edac/mc/mc0 2>&1; grep . /sys/devices/system/edac/mc/mc0/dimm0/* 2>&1
            section placement; grep Cpus_allowed_list /proc/self/status; lscpu -e=CPU,CORE,SOCKET
