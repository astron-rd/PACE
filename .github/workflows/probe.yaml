name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: defq, gpu: A100 }
          - { partition: defq, gpu: V100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            for t in edac-util ras-mc-ctl edac-ctl hwloc-info hwloc-calc nvidia-smi udevadm; do echo "R path $t: $(command -v $t || echo -)"; done
            dpkg-query -W -f='R pkg ${Package} ${Version} ${db:Status-Status}\n' edac-utils rasdaemon hwloc pciutils 2>&1 | sed 's/^dpkg-query/R pkg dpkg-query/'
            ls /usr/sbin /usr/bin /usr/local/bin /usr/local/sbin 2>/dev/null | grep -iE "edac|ras-mc|rasdaemon" | sed 's/^/R found /'
            find /var/software /opt -maxdepth 6 \( -name "edac-util" -o -name "ras-mc-ctl" \) 2>/dev/null | head | sed 's/^/R found /'
            systemctl is-active rasdaemon 2>&1 | sed 's/^/R rasdaemon service: /'
            edac-util -s 2>&1 | head -3 | sed 's/^/R edac-util: /'
            ras-mc-ctl --layout 2>&1 | head -5 | sed 's/^/R ras-mc-ctl: /'
