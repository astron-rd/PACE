name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: defq, gpu: A4000 }
          - { partition: defq, gpu: V100 }
          - { partition: defq, gpu: A100 }
          - { partition: defq, gpu: TitanRTX }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            set +e
            hostname
            scontrol show node "$SLURMD_NODENAME" | grep -oE "RealMemory=[0-9]+"
            lsmem --summary 2>&1
            python3 - <<'PY'
            import glob, re, subprocess
            def rd(p):
                try: return open(p).read().strip()
                except OSError as e: return f"<{e.strerror}>"
            GiB = 1 << 30
            kib = int(re.search(r"MemTotal:\s+(\d+)", rd("/proc/meminfo"))[1])
            print(f"meminfo MemTotal      {kib * 1024 / GiB:8.2f} GiB")
            udev = subprocess.run(["udevadm", "info", "/sys/class/dmi/id"], capture_output=True, text=True).stdout
            sizes = [int(v) for k, v in re.findall(r"E: (MEMORY_DEVICE_\d+_SIZE)=(\d+)", udev)]
            print(f"dmi       DIMMs       {sum(sizes) / GiB:8.2f} GiB  n={len(sizes)} {sorted(set(s // GiB for s in sizes))}")
            print("dmi       array max  ", re.findall(r"MEMORY_ARRAY_\w+=\S+", udev))
            edac = [int(rd(f)) for f in glob.glob("/sys/devices/system/edac/mc/mc*/dimm*/size")]
            print(f"edac      DIMMs       {sum(edac) / 1024:8.2f} GiB  n={len(edac)}")
            bs = int(rd("/sys/devices/system/memory/block_size_bytes"), 16)
            on = sum(rd(f) == "online" for f in glob.glob("/sys/devices/system/memory/memory*/state"))
            print(f"sysfs     mem blocks  {on * bs / GiB:8.2f} GiB  block={bs >> 20} MiB n={on}")
            nodes = [int(re.search(r"MemTotal:\s+(\d+)", rd(f))[1]) for f in glob.glob("/sys/devices/system/node/node*/meminfo")]
            print(f"numa      MemTotal    {[round(n / 2**20, 1) for n in nodes]} GiB")
            ram = []
            for d in glob.glob("/sys/firmware/memmap/*"):
                if rd(f"{d}/type") == "System RAM":
                    try: ram.append(int(rd(f"{d}/end"), 16) - int(rd(f"{d}/start"), 16) + 1)
                    except ValueError: pass
            print(f"firmware  memmap RAM  {sum(ram) / GiB:8.2f} GiB  n={len(ram)}")
            PY
