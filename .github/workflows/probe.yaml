name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: rbq, gpu: R9700 }
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            echo "R nproc: [$(nproc)]"
            echo "R lscpu sed: [$(lscpu | sed -n 's/^Model name: *//p')]"
            echo "R gib: [$(( $(cat /sys/devices/system/edac/mc/mc*/size_mb | paste -sd+) >> 10 ))]"
            echo "R mts: [$(udevadm info -q property /sys/class/dmi/id | grep -m1 CONFIGURED_SPEED_MTS)]"
            echo "R nvidia: [$(nvidia-smi --query-gpu=name --format=csv,noheader 2>&1)]"
            source /etc/profile.d/lmod.sh && module load rocm 2>/dev/null
            echo "R amd grep: [$(amd-smi static --asic 2>&1 | grep MARKET_NAME)]"
