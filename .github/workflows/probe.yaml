name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            set +e
            hostname
            ls -l /sys/firmware/dmi/tables/ /sys/firmware/acpi/tables/ | head -40
            ls -ld /sys/firmware/dmi/entries/17-* | head -3; ls -d /sys/firmware/dmi/entries/17-* | wc -l
            head -c 64 /sys/firmware/dmi/entries/17-0/raw | od -An -tx1 | head -2
            udevadm --version
            udevadm info /sys/class/dmi/id | grep -E "MEMORY_(ARRAY|DEVICE_[0-9]+_(SIZE|LOCATOR|PRESENT))" | head -60
            udevadm info /sys/class/dmi/id | grep -c MEMORY_DEVICE_.*_SIZE
            awk '/^Node/{z=$0} /present/{p+=$2} /spanned/{s+=$2} END{print "zoneinfo present GiB", p*4096/2^30, "spanned GiB", s*4096/2^30}' /proc/zoneinfo
            dmesg 2>&1 | grep -E "^\[.*\] Memory:|DMI:|e820" | head -5
            journalctl -k -b 2>&1 | grep -E "Memory:" | head -3
            which lstopo hwloc-ls lshw dmidecode inxi 2>&1
            cat /sys/devices/system/node/node*/meminfo | grep MemTotal
