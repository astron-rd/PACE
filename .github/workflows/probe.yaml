name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            python3 --version | sed 's/^/R /'
            ls /run/udev/data/ | grep -i dmi | sed 's/^/R udevdata: /'
            python3 - <<'PY'
            import glob, os, pathlib, re
            def r(k, f):
                try: v = f()
                except Exception as e: v = f"ERR {type(e).__name__}: {e}"
                print(f"R py {k}: [{v}]")
            r("cpu.model", lambda: next(l.split(":", 1)[1].strip() for l in open("/proc/cpuinfo") if l.startswith("model name")))
            r("sched_getaffinity", lambda: len(os.sched_getaffinity(0)))
            r("process_cpu_count", lambda: os.process_cpu_count())
            r("cpu_count", lambda: os.cpu_count())
            r("SLURM_CPUS_ON_NODE", lambda: int(os.environ["SLURM_CPUS_ON_NODE"]))
            r("memory.gib", lambda: sum(int(pathlib.Path(p).read_text()) for p in glob.glob("/sys/devices/system/edac/mc/mc*/size_mb")) >> 10)
            r("memory.mts", lambda: re.search(r"_CONFIGURED_SPEED_MTS=(\d+)", pathlib.Path("/run/udev/data/+dmi:id").read_text())[1])
            r("pynvml", lambda: __import__("pynvml"))
            r("amdsmi", lambda: __import__("amdsmi"))
            PY
