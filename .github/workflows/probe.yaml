name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    steps:
      - run: |
          echo "R home $HOME ws $GITHUB_WORKSPACE"
          echo "R uv $(command -v uv || echo none)"
          git --version
          sinfo -o '%P|%N|%f|%G|%c|%m' | sed 's/^/R sinfo /'
          module avail 2>&1 | grep -iE 'python|uv' | sed 's/^/R mod /' || true
      - uses: astral-sh/setup-uv@v10.1.0
      - run: echo "R uv after $(command -v uv)"; uv --version
      - uses: astron-rd/slurm-action@v1.3
        with:
          time: 00:10:00
          commands: |
            hostname
            echo "R cpus $SLURM_CPUS_ON_NODE"
            echo "R uv node $(command -v uv)"
            nvidia-smi --query-gpu=name --format=csv,noheader && echo "R nvsmi ok" || echo "R nvsmi rc $?"
            uv python find 3.14 || uv python install 3.14
            uv run --python 3.14 python -c 'import sys; print("R py", sys.version)'
      - uses: astron-rd/slurm-action@v1.3
        with:
          partition: defq
          constraints: A100
          time: 00:05:00
          commands: |
            hostname
            nvidia-smi --query-gpu=name --format=csv,noheader && echo "R nvsmi nogres ok" || echo "R nvsmi nogres rc $?"
