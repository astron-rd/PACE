name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            hwloc-info --help 2>&1 | grep -iE "attr|^ *-[a-z] " | sed 's/^/R hi-help: /'
            hwloc-calc --help 2>&1 | grep -iE "number" | sed 's/^/R hc-help: /'
            hwloc-info 2>&1 | sed 's/^/R hwloc-info: /'
            hwloc-info package:0 2>&1 | grep -iE "CPUModel|cpuset" | sed 's/^/R hi-pkg: /'
            hwloc-info -g "info CPUModel" package:0 2>&1 | sed 's/^/R hi-g: /'
            hwloc-calc -N pu all 2>&1 | sed 's/^/R hc-N: /'
            hwloc-calc -N pu 2>&1 | head -2 | sed 's/^/R hc-N-noall: /'
            nvidia-smi -L 2>&1 | sed 's/^/R nv-L: /'
            nvidia-smi --help-query-gpu 2>&1 | grep -iE "^\"name\"|product_name" | sed 's/^/R nv-q: /'
            udevadm info /sys/class/dmi/id 2>&1 | grep -m1 CONFIGURED_SPEED_MTS | sed 's/^/R udev: /'
            source /etc/profile.d/lmod.sh && module load rocm 2>/dev/null
            amd-smi static --help 2>&1 | grep -iE "asic" | sed 's/^/R amd-help: /'
            amd-smi static -a 2>&1 | grep MARKET_NAME | sed 's/^/R amd-a: /'
            amd-smi list 2>&1 | grep -i name | sed 's/^/R amd-list: /'
