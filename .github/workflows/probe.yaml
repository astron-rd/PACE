name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            source /etc/profile.d/lmod.sh
            module load spack/2026.10.06 >/dev/null 2>&1
            echo "LOADED=$LOADEDMODULES"
            echo "MODULEPATH=$MODULEPATH"
            module -t avail 2>&1 | grep -v ':$' | sed 's/^/AVAIL /'
            command -v spack && spack --version
            spack find 2>&1 | grep -iE "python|uv|hwloc|pciutils|dmidecode|lshw|clinfo|vulkan|rocm|cuda" | head -40 | sed 's/^/FIND /'
