name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: R9700 }
          - { partition: rbq, gpu: W7700 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            set +e
            hostname
            ls /opt/rocm/bin | grep -iE "smi|rocminfo|agent" | tr "\n" " "; echo
            echo "--- amd-smi"; /opt/rocm/bin/amd-smi static --asic --bus 2>&1 | grep -iE "^GPU|MARKET|BDF|DEVICE_ID|REV_ID|PRODUCT" | head -20
            echo "--- rocm-smi"; /opt/rocm/bin/rocm-smi --showproductname 2>&1 | grep -iE "GPU\[" | head -10
            echo "--- rocminfo"; /opt/rocm/bin/rocminfo 2>&1 | grep -E "Marketing Name|^  Name:" | head -10
            echo "--- HIP_VISIBLE/ROCR"; env | grep -E "ROCR|HIP_VIS|GPU_DEVICE"
