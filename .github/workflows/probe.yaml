name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            set +e
            hostname
            echo "PATH=$PATH"
            echo "plain: $(command -v amd-smi || echo missing)"
            echo "login shell: $(bash -lc 'command -v amd-smi' || echo missing)"
            source /etc/profile.d/lmod.sh
            module load rocm 2>&1
            echo "module rocm: $(command -v amd-smi || echo missing) loaded=$LOADEDMODULES"
            amd-smi static --asic 2>&1 | grep MARKET_NAME
            stat -c '%y %n' /opt/rocm-7.14.0 /opt/rocm-7.14.0/bin/amd-smi
            readlink -f /opt/rocm
