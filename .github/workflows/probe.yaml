name: probe
on:
  push:
    branches: [probe/das6-hardware]
    paths: [.github/workflows/probe.yaml]
jobs:
  probe:
    runs-on: [slurm]
    steps:
      - uses: astron-rd/slurm-action@v1.4
        with:
          partition: rbq
          constraints: zen5
          time: 00:05:00
          commands: |
            set +e
            module load spack
            module avail 2>&1 | grep -i -E 'hdf5|fftw' | sed 's/^/R /'
            module load hdf5 && echo "R loaded hdf5: HDF5_DIR=${HDF5_DIR:-unset} HDF5_ROOT=${HDF5_ROOT:-unset} h5cc=$(command -v h5cc) pc=$(pkg-config --modversion hdf5 2>&1)"
