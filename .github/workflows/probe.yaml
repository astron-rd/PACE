name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            set +e
            hostname
            ls /sys/devices/system/edac/mc/mc0
            for m in /sys/devices/system/edac/mc/mc*; do echo "$m size_mb=$(cat $m/size_mb) name=$(cat $m/mc_name)"; done
            for f in /sys/devices/system/edac/mc/mc*/{dimm,rank}*/size; do echo "$f $(cat $f) $(cat ${f%size}dimm_label 2>/dev/null) $(cat ${f%size}dimm_mem_type 2>/dev/null)"; done 2>&1 | head -40
            ls -l /sys/bus/i2c/devices/2-0056/
