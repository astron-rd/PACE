name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            gres: ""
          - name: A4000
            gres: gpu:A4000
    name: probe (${{ matrix.name }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: defq
          gres: ${{ matrix.gres }}
          time: 00:05:00
          commands: |
            set +e
            section() { echo; echo "### $*"; }
            hostname
            sinfo -o "%P %N %G %f" 2>&1
            scontrol show config 2>&1 | grep -iE "^(SLURM_VERSION|GresTypes|SelectType)"
            nvidia-smi --query-gpu=name,memory.total,pci.device_id,mig.mode.current --format=csv 2>&1
