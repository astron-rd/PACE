name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: R9700 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            set +e
            hostname
            source /etc/profile.d/lmod.sh 2>/dev/null
            module -t avail 2>&1 | grep -iE "rocm|amd|hip|cuda|nvhpc|pci" | head -20
            ls -d /opt/rocm* /opt/amdgpu* 2>&1
            lspci --version
            ls -l /usr/share/misc/pci.ids /usr/share/hwdata/pci.ids 2>&1
            head -20 /usr/share/misc/pci.ids 2>/dev/null | grep -i version
            curl -sS -m 10 -o /tmp/pci.ids.$$ https://pci-ids.ucw.cz/v2.2/pci.ids && echo download ok
            bus=$(basename $(readlink -f /sys/class/drm/renderD130/device))
            lspci -vmm -s $bus | grep ^Device
            lspci -i /tmp/pci.ids.$$ -vmm -s $bus | grep ^Device
            rm -f /tmp/pci.ids.$$
