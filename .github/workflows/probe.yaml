name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: rbq, gpu: R9700 }
          - { partition: rbq, gpu: AD4000 }
          - { partition: rbq, gpu: B4000 }
          - { partition: rbq, gpu: AD5000 }
          - { partition: defq, gpu: A4000 }
          - { partition: defq, gpu: V100 }
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            set +e
            python3 - <<'PY'
            import glob, os, socket
            rd = lambda p: open(p).read().strip()
            mcs = sorted(glob.glob("/sys/devices/system/edac/mc/mc*/"))
            mb = [int(rd(m + "size_mb")) for m in mcs]
            names = sorted({rd(m + "mc_name") for m in mcs})
            print(f"RESULT {socket.gethostname()} edac_gib={sum(mb) / 1024} per_mc={mb} drivers={names}")
            for m in mcs[:1]:
                print("RESULT  entries", sorted(os.path.basename(d) for d in glob.glob(m + "*") if os.path.basename(d)[:4] in ("dimm", "rank", "csro"))[:4])
            PY
