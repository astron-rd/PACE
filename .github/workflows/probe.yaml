name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rbq-none, partition: rbq, gres: "" }
          - { name: rbq-W7700, partition: rbq, gres: "gpu:W7700" }
          - { name: defq-A4000, partition: defq, gres: "gpu:A4000" }
          - { name: defq-none, partition: defq, gres: "" }
    name: probe (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: astron-rd/slurm-action@v1.3
        with:
          partition: ${{ matrix.partition }}
          gres: ${{ matrix.gres }}
          time: 00:05:00
          commands: |
            hostname
            module load rocm || true
            command -v lspci | sed 's/^/R which: /' || echo "R which: no lspci"
            lspci --version 2>&1 | sed 's/^/R version: /'
            lspci -nn | grep -E '\[03[0-9a-f]{2}\]' | sed 's/^/R lspci: /'
            lspci -vmm | awk -v RS= '/Class:\t(VGA|3D|Display)/' | grep -E '^(Slot|Vendor|Device|SVendor|SDevice):' | sed 's/^/R vmm: /'
            uv run --locked --project bench python -c 'from pace_bench.hardware import detect; print("R", detect().model_dump_json())' || echo "R detect failed $?"
