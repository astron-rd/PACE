name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: rbq, gpu: AD4000 }
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            ls /etc/OpenCL/vendors/ 2>&1 | sed 's/^/ICD /'
            source /etc/profile.d/lmod.sh 2>/dev/null
            module load rocm >/dev/null 2>&1
            clinfo 2>&1 | grep -E "Number of platforms|Platform Name|Number of devices|  Device Name|Board Name" | sed 's/^/CL /'
