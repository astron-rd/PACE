name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            gres: ""
          - name: A4000
            gres: gpu:A4000
    name: probe (${{ matrix.name }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: defq
          gres: ${{ matrix.gres }}
          time: 00:05:00
          commands: |
            set +e
            section() { echo; echo "### $*"; }
            hostname
            python3 - <<'PY'
            import json, os, re, subprocess

            def run(*cmd):
                r = subprocess.run(cmd, capture_output=True, text=True)
                return r.stdout if r.returncode == 0 else ""

            lscpu = dict(l.split(":", 1) for l in run("lscpu").splitlines() if ":" in l)
            udev = dict(
                l[3:].split("=", 1)
                for l in run("udevadm", "info", "/sys/class/dmi/id").splitlines()
                if l.startswith("E: ")
            )
            sizes = [int(v) for k, v in udev.items() if re.fullmatch(r"MEMORY_DEVICE_\d+_SIZE", k)]
            speeds = {int(v) for k, v in udev.items() if re.fullmatch(r"MEMORY_DEVICE_\d+_CONFIGURED_SPEED_MTS", k)}
            gpus = []
            for row in run("nvidia-smi", "--query-gpu=name,memory.total,driver_version", "--format=csv,noheader,nounits").splitlines():
                name, mib, driver = (f.strip() for f in row.split(","))
                gpus.append({"model": name, "memory_mib": int(mib), "driver": driver})
            hardware = {
                "cpu": {"model": lscpu["Model name"].strip(), "threads": len(os.sched_getaffinity(0))},
                "memory": {"mib": sum(sizes) // 2**20, "mts": sorted(speeds)},
                "gpus": gpus,
            }
            print(json.dumps({"hardware": hardware}, indent=2))
            print("dimms:", len(sizes), "speeds:", sorted(speeds))
            print(open("/proc/meminfo").readline().strip())
            PY
