name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rbq-none, partition: rbq, gres: "" }
          - { name: rbq-W7700, partition: rbq, gres: "gpu:W7700" }
          - { name: defq-A4000, partition: defq, gres: "gpu:A4000" }
          - { name: defq-none, partition: defq, gres: "" }
    name: probe (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: astron-rd/slurm-action@v1.3
        with:
          partition: ${{ matrix.partition }}
          gres: ${{ matrix.gres }}
          time: 00:05:00
          commands: |
            hostname
            module load rocm || true
            grep CONFIGURED_SPEED_MTS /run/udev/data/+dmi:id | sed 's/^/R dmi: /'
            uv run --locked --project bench python -c 'from pace_bench.hardware import detect; print("R", detect().model_dump_json())' || echo "R detect failed $?"
