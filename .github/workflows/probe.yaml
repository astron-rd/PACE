name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            echo "R env OMP: [${OMP_NUM_THREADS-unset}] [${OMP_THREAD_LIMIT-unset}]"
            echo "R nproc: [$(nproc)]"
            echo "R OMP_NUM_THREADS=4 nproc: [$(OMP_NUM_THREADS=4 nproc)]"
            echo "R SLURM_CPUS_ON_NODE: [${SLURM_CPUS_ON_NODE-unset}]"
            echo "R SLURM_JOB_CPUS_PER_NODE: [${SLURM_JOB_CPUS_PER_NODE-unset}]"
            echo "R hwloc-calc: [$(hwloc-calc -N pu all)]"
