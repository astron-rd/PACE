name: probe
on:
  push:
    branches: [probe/das6-hardware]
jobs:
  probe:
    runs-on: [slurm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: rbq, gpu: W7700 }
          - { partition: defq, gpu: A100 }
    name: probe (${{ matrix.gpu }})
    steps:
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: gpu:${{ matrix.gpu }}
          time: 00:05:00
          commands: |
            hostname
            source /etc/profile.d/lmod.sh 2>/dev/null
            run() {
              echo "=== $1"; lstopo-no-graphics --version
              lstopo-no-graphics --of xml 2>/dev/null > /tmp/t.$$.xml
              grep -oE 'name="(CPUModel|GPUModel|GPUVendor|AMDProductName|AMDUUID|Backend|DMI[A-Za-z]*|PCIVendor|PCIDevice|Model|Size|Speed|DeviceLocation)" value="[^"]*"' /tmp/t.$$.xml | sort | uniq -c | sed 's/^/X /'
              grep -oE 'type="(OSDev|Misc|MemCache)"[^>]*name="[^"]*"' /tmp/t.$$.xml | sort -u | sed 's/^/O /' | head -20
              echo "PU $(hwloc-calc --number-of pu all 2>&1)  allowed: $(hwloc-calc --number-of pu all --restrict binding 2>&1)"
              grep -oE 'local_memory="[0-9]+"' /tmp/t.$$.xml | sed 's/^/MEM /'
              rm -f /tmp/t.$$.xml
            }
            run system
            module load rocm >/dev/null 2>&1; run "system+rocm"
            module load spack/2026.10.06 >/dev/null 2>&1; module load hwloc >/dev/null 2>&1; run "spack hwloc+rocm"
