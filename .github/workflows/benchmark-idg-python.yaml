name: benchmark-idg-python
on:
  push:
    branches: [main]
    paths:
      - apps/idg/python/**
      - apps/idg/input/**
      - bench/**
      - '!**.md'
  workflow_dispatch:
jobs:
  benchmark:
    uses: ./.github/workflows/benchmark.yaml
    with:
      name: idg-python
      application: idg
      language: python
      framework: numba
      partition: rbq
      constraints: zen5
    secrets: inherit
