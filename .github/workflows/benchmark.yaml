name: benchmark
on:
  push:
    branches: [probe/das6-hardware]
    paths:
      - .github/workflows/benchmark.yaml
      - apps/**
      - bench/**
  workflow_dispatch:
jobs:
  run:
    name: ${{ matrix.name }}
    runs-on: [slurm]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: idg-python
            application: idg
            language: python
            framework: numba
            partition: defq
            constraints: A4000
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: astron-rd/slurm-action@v1.3
        with:
          partition: ${{ matrix.partition }}
          constraints: ${{ matrix.constraints }}
          gres: ${{ matrix.gres }}
          time: 00:30:00
          commands: |
            start=$(date -u +%FT%TZ)
            uvx pre-commit run --verbose --hook-stage manual benchmark-${{ matrix.name }}
            uv run --locked --project bench record measurements.json \
              --application ${{ matrix.application }} --language ${{ matrix.language }} \
              ${{ matrix.framework && format('--framework {0}', matrix.framework) }} --timestamp "$start"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.name }}
          path: results/
          if-no-files-found: error
