name: benchmark
on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      application:
        type: string
        required: true
      language:
        type: string
        required: true
      framework:
        type: string
      partition:
        type: string
        required: true
      constraints:
        type: string
      gres:
        type: string
jobs:
  run:
    name: ${{ inputs.name }}
    runs-on: [slurm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: astron-rd/slurm-action@v1.4
        with:
          partition: ${{ inputs.partition }}
          constraints: ${{ inputs.constraints }}
          gres: ${{ inputs.gres }}
          time: 00:30:00
          commands: |
            start=$(date -u +%FT%TZ)
            uvx pre-commit run --verbose --hook-stage manual benchmark-${{ inputs.name }}
            uv run --locked --project bench record measurements.json \
              --application ${{ inputs.application }} --language ${{ inputs.language }} \
              ${{ inputs.framework && format('--framework {0}', inputs.framework) }} \
              --commit ${{ github.sha }} --timestamp "$start"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.name }}
          path: results/
          if-no-files-found: error
  store:
    needs: run
    runs-on: ubuntu-26.04
    concurrency:
      group: benchmark-store
      queue: max
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/download-artifact@v8.0.2
        with:
          path: results
          merge-multiple: true
      - name: Commit and push results
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git add results
          git commit -m "Record benchmark results for ${GITHUB_SHA::8}"
          git pull --rebase
          git push
