[package]
name = "idg"
version = "0.1.0"
edition = "2024"
default-run = "idg"

[features]
f64 = []

[[bench]]
harness = false
name = "kernels"

[dependencies]
anyhow = "1.0.101"
approx = "0.5.1"
clap = { version = "4.5.54", features = ["derive"] }
fftw = "0.8.0"
hdf5-metno = { version = "0.15", features = ["complex"] }
indexmap = { version = "2.14.2", features = ["serde"] }
itertools = "0.14.0"
ndarray = { version = "0.17.2", features = ["rayon", "serde"] }
ndarray-rand = "0.16.0"
num-complex = "0.4.6"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
criterion = "0.7.0"

[lints.clippy]
excessive_precision = "allow"

[patch.crates-io]
ndarray = { git = "https://github.com/rust-ndarray/ndarray.git" }
